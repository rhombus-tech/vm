// tee/proto/tee_service.proto
syntax = "proto3";
package teeservice;
option go_package = "github.com/rhombus-tech/vm/tee";

service TeeExecution {
    // Maps to SendEventAction
    rpc Execute(ExecutionRequest) returns (ExecutionResult);
}

message ExecutionRequest {
    string id_to = 1;  // Matches SendEventAction.IDTo
    string function_call = 2;  // Matches SendEventAction.FunctionCall
    bytes parameters = 3;  // Matches SendEventAction.Parameters
    string region_id = 4;  // Matches SendEventAction.RegionID
}

message ExecutionResult {
    repeated TEEAttestation attestations = 1;  // Matches SendEventAction.Attestations
    bytes state_hash = 2;  // For verification
    bytes result = 3;  // Execution result
}

message TEEAttestation {
    bytes enclave_id = 1;  // Matches TEEAttestation.EnclaveID
    bytes measurement = 2;  // Matches TEEAttestation.Measurement 
    string timestamp = 3;   // Matches TEEAttestation.Timestamp
    bytes data = 4;        // Matches TEEAttestation.Data
    bytes signature = 5;    // Matches TEEAttestation.Signature
    bytes region_proof = 6; // Matches TEEAttestation.RegionProof
}