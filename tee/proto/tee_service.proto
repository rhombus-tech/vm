syntax = "proto3";

package teeservice;

option go_package = "github.com/rhombus-tech/vm/tee/proto/pb;pb";

service TeeExecution {
    rpc Execute(ExecutionRequest) returns (ExecutionResult);
    rpc GetRegions(GetRegionsRequest) returns (GetRegionsResponse);
}

message ExecutionRequest {
    string id_to         = 1;
    string function_call = 2;
    bytes  parameters    = 3;
    string region_id     = 4;
}

message ExecutionResult {
    // If you want a timestamp in the result:
    string timestamp = 1; 

    repeated TEEAttestation attestations = 2;
    bytes state_hash = 3;
    bytes result     = 4;
}

// If you really do want a separate Event message:
message Event {
    string id            = 1;
    string function_call = 2;
    bytes  parameters    = 3;
    string region_id     = 4;
    string timestamp     = 5;
    repeated TEEAttestation attestations = 6;
}

message TEEAttestation {
    bytes  enclave_id   = 1;
    bytes  measurement  = 2;
    string timestamp    = 3; 
    bytes  data         = 4;
    bytes  signature    = 5;
    bytes  region_proof = 6;
}

message GetRegionsRequest {}

message GetRegionsResponse {
    repeated Region regions = 1;
}

message Region {
    string id = 1;
    string created_at = 2;
    repeated string worker_ids = 3;
}